name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  MPLBACKEND: Agg
  UV_VERSION: "0.11.3"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-extras

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-extras

      - name: Run test suite
        run: uv run pytest

  package:
    name: Package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-extras

      - name: Build distributions
        run: uv build

      - name: Validate metadata
        run: uv run twine check --strict dist/*

      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/timelineviz-wheel-test
          /tmp/timelineviz-wheel-test/bin/pip install --upgrade pip
          /tmp/timelineviz-wheel-test/bin/pip install dist/*.whl
          /tmp/timelineviz-wheel-test/bin/python -c "import timelineviz; print(timelineviz.__version__)"
          /tmp/timelineviz-wheel-test/bin/timelineviz --help > /dev/null

  windows-smoke:
    name: Windows smoke test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-extras

      - name: Smoke test CLI
        run: |
          uv run python -c "import timelineviz; print(timelineviz.__version__)"
          uv run timelineviz --help
