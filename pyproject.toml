[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timelineviz"
dynamic = ["version"]
description = "Timeline visualisation for CSV data and Prometheus test files"
readme = "README.md"
authors = [
    {name = "Garry Williams"},
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
keywords = ["timeline", "visualisation", "prometheus", "promtool", "matplotlib"]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.4",
    "numpy>=1.20",
    "pandas>=1.3",
    "python-dateutil>=2.8",
    "pytz>=2021.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/garrywilliams/timeline_viz"
Source = "https://github.com/garrywilliams/timeline_viz"
Issues = "https://github.com/garrywilliams/timeline_viz/issues"
Changelog = "https://github.com/garrywilliams/timeline_viz/blob/main/CHANGELOG.md"

[project.scripts]
timelineviz = "timelineviz.cli:main"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.2",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.11.0",
    "twine>=6.1",
]

[tool.hatch.version]
path = "src/timelineviz/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/timelineviz"]

[tool.pytest.ini_options]
testpaths = ["src/timelineviz/tests"]
addopts = "--cov=timelineviz --cov-report=term-missing"

[tool.coverage.run]
source = ["timelineviz"]
omit = [
    "*/_version.py",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pass",
]
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]
